[project]
name = "shortlist"
version = "0.1.0"
description = "Local job dashboard backend: Apify fetch, dedup, local LLM match."
authors = [{ name = "Batuhan Avcı" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apify-client>=3.3.0",
    "fastapi>=0.143.0",
    "fpdf2>=2.8.9",
    "httpx2>=2.13.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shortlist = "shortlist.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["shortlist"]
# backend/alembic/ (the migrations folder) would otherwise make ruff treat the package as local.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Job text is multilingual; non-ASCII characters in test strings are intended.
"tests/*" = ["RUF001"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
